name: portfolioblog

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: PortfolioBlog.Web/Dockerfile
    # 비루트(임의 uid, 이미지에 고정 계정이 없다). cap_drop: ALL 아래에서는 root도 80·443을 못 열므로
    # NET_BIND_SERVICE가 필수다(T3-6, 실측: CapEff에 그 비트만 켜진 채로 두 포트 바인드 성공).
    # /data/caddy·/config/caddy는 이미지가 이미 1777(모두 쓰기 가능한 sticky)로 만들어 둬 별도 chown 없이도 쓸 수 있다(실측).
    user: "1654:1654"
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    ports:
      - "${HTTP_BIND:-0.0.0.0:80}:80"
      - "${HTTPS_BIND:-0.0.0.0:443}:443"
    environment:
      DOMAIN: ${DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # public: 포트 게시(80·443)와 ACME 아웃바운드가 실제로 오가는 유일한 통로. caddy만 여기 있다(T3-1).
      public: {}
      # edge: caddy↔api 전용, internal이라 인터넷으로 나가지 못한다. caddy는 두 망에 동시에 붙어(멀티홈)
      # 포트 게시는 public으로, api와의 통신은 이 고정 IP로 한다 — Proxy__TrustedIp가 이 값을 신뢰한다.
      edge:
        ipv4_address: 172.30.0.2
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ..
      dockerfile: PortfolioBlog.Api/Dockerfile
    read_only: true
    # 11MiB(관리 업로드 상한) × 업로드 동시 실행 상한 2(Admin__UploadConcurrency, 스펙 3.7) ≈ 22MiB. 64m은 그 3배 여유다.
    # 동시 실행 상한을 올리면 이 값도 같이 올린다 — 안 그러면 셋째 업로드부터 tmpfs 고갈로 400이 난다(T3-4, 실측).
    tmpfs:
      - /tmp:mode=1777,size=64m
    environment:
      ConnectionStrings__Default: "Server=mysql;Database=blog;User ID=blog_app;Password=${BLOG_APP_PASSWORD:?};SslMode=Required;Default Command Timeout=30"
      ConnectionStrings__Public: "Server=mysql;Database=blog;User ID=blog_public;Password=${BLOG_PUBLIC_PASSWORD:?};SslMode=Required;Default Command Timeout=30"
      Site__PublicOrigin: ${PUBLIC_ORIGIN:?}
      Site__AdminOrigin: ${ADMIN_ORIGIN:?}
      Site__Title: ${SITE_TITLE:-Blog}
      Site__Description: ${SITE_DESCRIPTION:-}
      Site__Author: ${SITE_AUTHOR:-}
      Admin__AllowedCidrs: ${ADMIN_ALLOWED_CIDRS:?}
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:?}
      Proxy__TrustedIp: 172.30.0.2
    volumes:
      - attachments:/data/attachments
      - dpkeys:/data/dpkeys
    networks:
      - edge
      - db
    healthcheck:
      test: ["CMD", "dotnet", "PortfolioBlog.Api.dll", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 2s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    <<: *hardening
    image: mysql:8.4.11
    # 공식 엔트리포인트가 데이터 디렉터리 소유권을 맞추고 mysql 사용자로 내려간다(gosu). PG 판과 같은 최소 능력만 준다.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # 설정 파일을 마운트하지 않는다: MySQL은 world-writable 설정 파일을 조용히 무시한다(스펙 D19). 서버 설정은 전부 여기 인자로.
    command:
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --local-infile=0
      - --secure-file-priv=NULL
      - --require-secure-transport=ON
      - --innodb-lock-wait-timeout=10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      BLOG_APP_PASSWORD: ${BLOG_APP_PASSWORD:?}
      BLOG_PUBLIC_PASSWORD: ${BLOG_PUBLIC_PASSWORD:?}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/mysqld:mode=1777,size=1m
      - /tmp:mode=1777,size=64m
    networks:
      - db
    healthcheck:
      # mysqladmin ping은 인증 실패에도 0을 반환하므로 앱 사용자로 실제 쿼리를 한다. -h 127.0.0.1(TCP)이라 init 중 임시 서버(--skip-networking)에서는 실패한다.
      # 비밀번호는 명령줄이 아니라 MYSQL_PWD로 넘긴다(컨테이너 안 ps에 보이지 않게). $$는 compose 보간을 피해 컨테이너 셸이 펼치게 한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$BLOG_APP_PASSWORD\" mysql -h 127.0.0.1 -u blog_app --ssl-mode=REQUIRED -N -e 'SELECT 1' blog"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # 백업·복원 전용(backup.sh·restore.sh가 `docker compose run`으로만 띄운다). 평소에는 뜨지 않는다.
  tools:
    profiles: ["tools"]
    image: mysql:8.4.11
    user: "1654:1654"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - attachments:/data/attachments

networks:
  # ipam 없음: Docker가 알아서 서브넷을 고른다. caddy만 여기 붙는다(포트 게시·아웃바운드 전용, T3-1).
  public: {}
  # api는 여기로만 인터넷 유무와 무관하게 caddy와 통신한다 — internal이라 그 자체로는 밖으로 못 나간다.
  # 서브넷·ip_range·caddy 고정 IP(172.30.0.2)는 스모크 클라이언트(172.30.0.10·.11)의 IP 기반 검사가 그대로 쓴다.
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25
  db:
    internal: true

volumes:
  mysqldata:
  attachments:
  dpkeys:
  caddy_data:
  caddy_config:

name: CI

on:
  push:
    branches: [ master, feature/**, feat/** ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (unit + Testcontainers integration)
        run: dotnet test --configuration Release --no-build --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortfolioBlog.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PortfolioBlog.Web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    needs: [test, web]
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: e2e-ci-dummy
          MYSQL_DATABASE: blog_e2e
        ports:
          - 3307:3306
        # 서비스 컨테이너에는 명령 인자를 줄 수 없다 — 트랜잭션의 READ COMMITTED는 앱 인터셉터가 보장한다(스펙 D7). 트랜잭션 밖 단일 문장은 이 잡에서만 REPEATABLE READ로 돈다.
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -uroot -pe2e-ci-dummy -N -e 'SELECT 1' blog_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      E2E_SKIP_DOCKER: '1'
      E2E_DB_PORT: '3307'
      E2E_DB_PASSWORD: e2e-ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PortfolioBlog.Web/package-lock.json
      - name: Build API
        run: dotnet build PortfolioBlog.Api --configuration Release
      - name: Install web dependencies
        working-directory: PortfolioBlog.Web
        run: npm ci
      - name: Install browsers
        working-directory: PortfolioBlog.Web
        run: npx playwright install --with-deps chromium firefox
      - name: Prepare (dev cert, password hash)
        working-directory: PortfolioBlog.Web
        run: npm run e2e:prepare
      - name: E2E
        working-directory: PortfolioBlog.Web
        run: npm run e2e
      # trace에는 로그인 요청 본문과 세션 쿠키가 담기지만, 둘 다 이 실행 한 번을 위해 새로 만들고 실행이 끝나면 버리는
      # 값이다(비밀번호는 e2e:prepare가 매번 새로 만들고, API는 이 러너의 루프백에만 바인딩된다 — 외부에서 재사용할 수 없다).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: PortfolioBlog.Web/test-results
          retention-days: 7

  deploy-smoke:
    runs-on: ubuntu-latest
    needs: [test, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PortfolioBlog.Web/package-lock.json
      - name: Install web dependencies (Playwright)
        working-directory: PortfolioBlog.Web
        run: npm ci
      - name: Install browsers
        working-directory: PortfolioBlog.Web
        run: npx playwright install --with-deps chromium firefox
      # 운영과 같은 이미지·Caddyfile·compose를 띄워: 접근 통제(허용·비허용 IP), 헤더, 한도, DB 롤, 백업→삭제→복원, 브라우저 E2E.
      - name: Deployment stack smoke
        run: SMOKE_E2E=1 bash deploy/smoke/run.sh
      # trace의 비밀번호·쿠키는 이 실행을 위해 run.sh가 새로 만든 버려질 값이고, 스택은 러너의 루프백에만 바인딩된다.
      # caddy.log(run.sh의 cleanup 트랩이 남김)는 접근 로그라 remote_ip·상태 코드·경로만 있고 비밀값이 없다 —
      # 허용 IP가 러너에서 다르게 나오면(지시서가 예상한 "첫 Linux 실행" 실패 모드) 이 파일로 원인을 읽는다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-smoke-traces
          path: |
            PortfolioBlog.Web/test-results
            deploy/smoke/caddy.log
          retention-days: 7

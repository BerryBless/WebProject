name: CI

on:
  push:
    branches: [ master, feature/** ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (unit + Testcontainers integration)
        run: dotnet test --configuration Release --no-build --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortfolioBlog.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PortfolioBlog.Web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    needs: [test, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: e2e-ci-dummy
          POSTGRES_DB: blog_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      E2E_SKIP_DOCKER: '1'
      E2E_PG_PORT: '5433'
      E2E_PG_PASSWORD: e2e-ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PortfolioBlog.Web/package-lock.json
      - name: Build API
        run: dotnet build PortfolioBlog.Api --configuration Release
      - name: Install web dependencies
        working-directory: PortfolioBlog.Web
        run: npm ci
      - name: Install browsers
        working-directory: PortfolioBlog.Web
        run: npx playwright install --with-deps chromium firefox
      - name: Prepare (dev cert, password hash)
        working-directory: PortfolioBlog.Web
        run: npm run e2e:prepare
      - name: E2E
        working-directory: PortfolioBlog.Web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: PortfolioBlog.Web/test-results
          retention-days: 7
